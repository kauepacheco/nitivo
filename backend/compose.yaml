services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nitivo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nitivo-local
      TZ: UTC
    ports:
      - "54329:5432"
    volumes:
      - nitivo-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nitivo"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  nitivo-postgres:
